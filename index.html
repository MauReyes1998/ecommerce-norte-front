<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NORTE · ropa urbana para hombre y mujer. Envíos a todo México." />
    <meta name="theme-color" content="#111111" />
    <title>NORTE · Ropa urbana</title>
    <!-- PWA: el manifest lo inyecta vite-plugin-pwa al compilar. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="NORTE" />
    <!-- Open Graph: lo que ven WhatsApp, Facebook y X al compartir un link de la tienda. -->
    <meta property="og:site_name" content="NORTE" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NORTE · Ropa urbana" />
    <meta property="og:description" content="Ropa urbana para hombre y mujer. Envíos a todo México." />
    <!-- Sube una imagen 1200×630 a public/og.jpg para que el link se comparta con foto. -->
    <meta property="og:image" content="/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-white text-ink antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
